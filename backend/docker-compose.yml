services:
  api:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI_FILE: /run/secrets/mongo_uri
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ACCESS_SECRET_FILE: /run/secrets/jwt_access_secret
      JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.resend.com}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_SECURE: ${EMAIL_SECURE:-true}
      EMAIL_USER: ${EMAIL_USER:-resend}
      EMAIL_PASSWORD_FILE: /run/secrets/email_password
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Feature Flag API}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-onboarding@resend.dev}
      APP_NAME: ${APP_NAME:-Feature Flag API}
      APP_BASE_URL: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}
      FRONTEND_URL: ${PRODUCTION_FRONTEND_URL:?Set PRODUCTION_FRONTEND_URL in .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_TLS: "false"
    expose:
      - "3000"
    secrets:
      - mongo_uri
      - jwt_secret
      - jwt_access_secret
      - jwt_refresh_secret
      - redis_password
      - google_client_secret
      - email_password
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - edge
      - data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge

  mongo-backup:
    image: mongo:7
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    command:
      - sh
      - -ec
      - |
        while true; do
          archive="/backups/feature-flag-api-$$(date -u +%Y%m%dT%H%M%SZ).archive.gz"
          mongodump --uri="$$(cat /run/secrets/mongo_uri)" --archive="$$archive" --gzip
          find /backups -type f -name 'feature-flag-api-*.archive.gz' -mtime +$${BACKUP_RETENTION_DAYS} -delete
          sleep $${BACKUP_INTERVAL_SECONDS}
        done
    secrets:
      - mongo_uri
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    networks:
      - edge

volumes:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  data:
    internal: true

secrets:
  mongo_uri:
    file: ${SECRETS_DIR:-./secrets}/mongo_uri
  jwt_secret:
    file: ${SECRETS_DIR:-./secrets}/jwt_secret
  jwt_access_secret:
    file: ${SECRETS_DIR:-./secrets}/jwt_access_secret
  jwt_refresh_secret:
    file: ${SECRETS_DIR:-./secrets}/jwt_refresh_secret
  redis_password:
    file: ${SECRETS_DIR:-./secrets}/redis_password
  google_client_secret:
    file: ${SECRETS_DIR:-./secrets}/google_client_secret
  email_password:
    file: ${SECRETS_DIR:-./secrets}/email_password
